<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber Bangladesh (Strict Geofenced Edition)</title>
    
    <!-- Tailwind CSS (V4) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Leaflet Map CSS Modules -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <style>
        #map {
            height: 100%;
            width: 100%;
            background-color: #f3f4f6;
        }
        /* Custom UI Scrollbar layouts */
        .suggestions-box::-webkit-scrollbar {
            width: 5px;
        }
        .suggestions-box::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        /* Pulse Animation for Rider Tracker Node */
        .pulse-marker {
            background: #2563eb;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 0 8px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased overflow-hidden h-screen w-screen selection:bg-black selection:text-white">

    <!-- SCREEN 1: THE WELCOME & UBER PAYMENTS MODAL PANEL -->
    <div id="booking-screen" class="flex flex-col items-center justify-center min-h-screen p-4 z-50 relative transition-all duration-300">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-6 border border-gray-100">
            
            <div class="flex items-center justify-between mb-6">
                <span class="text-3xl font-black tracking-tighter text-black">Uber</span>
                <span class="bg-emerald-50 text-emerald-700 text-xs px-3 py-1 rounded-full font-bold flex items-center gap-1">
                    🇧🇩 Bangladesh Only
                </span>
            </div>

            <!-- Address Group Fields Selector Input Layout Box -->
            <div class="space-y-4 mb-6 relative">
                <!-- Pickup Option -->
                <div class="relative">
                    <label class="text-[11px] font-bold uppercase tracking-wider text-gray-400 block mb-1">Pickup Point</label>
                    <div class="absolute left-3 top-[34px] text-gray-400 text-xs">🟢</div>
                    <input id="pickup-input" type="text" autocomplete="off" oninput="handleBangladeshAutocomplete('pickup')" placeholder="Enter pickup address in Bangladesh..." class="w-full pl-9 pr-4 py-3.5 bg-gray-50 border border-gray-200/80 rounded-xl text-sm focus:outline-none focus:border-black focus:bg-white transition-all font-medium text-gray-800 placeholder-gray-400">
                    <div id="pickup-suggestions" class="suggestions-box absolute left-0 right-0 mt-1 bg-white border border-gray-200 rounded-xl shadow-2xl max-h-56 overflow-y-auto hidden z-50 divide-y divide-gray-50"></div>
                </div>
                
                <!-- Dropoff Option -->
                <div class="relative">
                    <label class="text-[11px] font-bold uppercase tracking-wider text-gray-400 block mb-1">Where To?</label>
                    <div class="absolute left-3 top-[34px] text-gray-400 text-xs">🔴</div>
                    <input id="dropoff-input" type="text" autocomplete="off" oninput="handleBangladeshAutocomplete('dropoff')" placeholder="Enter your destination..." class="w-full pl-9 pr-4 py-3.5 bg-gray-50 border border-gray-200/80 rounded-xl text-sm focus:outline-none focus:border-black focus:bg-white transition-all font-medium text-gray-800 placeholder-gray-400">
                    <div id="dropoff-suggestions" class="suggestions-box absolute left-0 right-0 mt-1 bg-white border border-gray-200 rounded-xl shadow-2xl max-h-56 overflow-y-auto hidden z-50 divide-y divide-gray-50"></div>
                </div>
            </div>

            <!-- Payment Methods Infrastructure Options Block Array -->
            <div class="mb-6">
                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-400 block mb-2">Payment Option</label>
                <div class="grid grid-cols-3 gap-2.5">
                    <!-- bKash System Mobile Checkout -->
                    <div onclick="selectPaymentGateway('bKash')" id="pay-bKash" class="payment-card border border-gray-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:border-gray-300 transition-all bg-gray-50">
                        <span class="text-xl mb-1">📱</span>
                        <span class="text-xs font-bold text-gray-800">bKash</span>
                    </div>
                    <!-- Digital Card Checking Account Gateway -->
                    <div onclick="selectPaymentGateway('Card')" id="pay-Card" class="payment-card border border-gray-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:border-gray-300 transition-all bg-gray-50">
                        <span class="text-xl mb-1">💳</span>
                        <span class="text-xs font-bold text-gray-800">Card</span>
                    </div>
                    <!-- Cash Hand to Hand Base Exchange Payment Options -->
                    <div onclick="selectPaymentGateway('Cash')" id="pay-Cash" class="payment-card border border-gray-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:border-gray-300 transition-all bg-gray-50">
                        <span class="text-xl mb-1">💵</span>
                        <span class="text-xs font-bold text-gray-800">Cash</span>
                    </div>
                </div>
            </div>

            <!-- Trigger Next Interface Action Form Button -->
            <button id="proceed-btn" onclick="initializeUberMapScreen()" disabled class="w-full py-4 bg-gray-200 text-gray-400 font-bold text-center rounded-xl transition-all cursor-not-allowed uppercase tracking-wider text-xs">
                Complete Information Above
            </button>
        </div>
    </div>


    <!-- SCREEN 2: NATIVE FULL VIEW ACTIVE RADAR TRACKING MAP SCREEN LAYOUT -->
    <div id="map-screen" class="hidden h-screen w-screen relative transition-all duration-500 opacity-0">
        
        <!-- Floating Live Left Active Dashboard Panel Layer -->
        <div class="absolute top-4 left-4 z-[1000] w-full max-w-sm bg-white rounded-2xl shadow-2xl p-5 border border-gray-100 flex flex-col">
            <div class="flex items-center justify-between mb-4 border-b border-gray-50 pb-3">
                <div>
                    <h2 class="text-base font-black text-gray-900 tracking-tight">Confirm Uber Request</h2>
                    <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider" id="selected-payment-label">Method: Cash</p>
                </div>
                <button onclick="returnBackToFormView()" class="text-xs bg-gray-100 font-bold text-gray-600 px-3 py-1.5 rounded-lg hover:bg-gray-200">Change</button>
            </div>

            <!-- Dynamic Pricing System Options (Based on True BD Distances) -->
            <div class="space-y-2 mb-4">
                <!-- UberX Base Tier Structure -->
                <div onclick="toggleRideTierStyle('UberX')" id="tier-UberX" class="car-tier border-2 border-black bg-white p-3.5 rounded-xl flex items-center justify-between cursor-pointer transition-all">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">🚗</span>
                        <div>
                            <h4 class="font-extrabold text-gray-900 text-xs">UberX</h4>
                            <p class="text-[10px] text-gray-400">Affordable local cars</p>
                        </div>
                    </div>
                    <span id="uberx-price" class="font-black text-sm text-gray-900">৳0.00</span>
                </div>

                <!-- Premium UberXL Massive SUV Fleet Tier Structure -->
                <div onclick="toggleRideTierStyle('UberXL')" id="tier-UberXL" class="car-tier border border-gray-200 bg-white p-3.5 rounded-xl flex items-center justify-between cursor-pointer transition-all hover:border-gray-300">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">🚙</span>
                        <div>
                            <h4 class="font-extrabold text-gray-900 text-xs">UberXL</h4>
                            <p class="text-[10px] text-gray-400">Large 6-seater vehicles</p>
                        </div>
                    </div>
                    <span id="uberxl-price" class="font-black text-sm text-gray-900">৳0.00</span>
                </div>

                <!-- Uber Moto Fleet Fast Transit Engine Options Line -->
                <div onclick="toggleRideTierStyle('Moto')" id="tier-Moto" class="car-tier border border-gray-200 bg-white p-3.5 rounded-xl flex items-center justify-between cursor-pointer transition-all hover:border-gray-300">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">🏍️</span>
                        <div>
                            <h4 class="font-extrabold text-gray-900 text-xs">Uber Moto</h4>
                            <p class="text-[10px] text-gray-400">Beat Bangladesh traffic fast</p>
                        </div>
                    </div>
                    <span id="moto-price" class="font-black text-sm text-gray-900">৳0.00</span>
                </div>
            </div>

            <!-- Route Summary Matrix Box -->
            <div class="text-[11px] text-gray-500 flex justify-between border-t pt-3 mb-4 border-gray-100 font-medium">
                <span>Calculated Distance: <b id="meta-distance" class="text-black font-bold">0.00 km</b></span>
                <span>Est Duration: <b id="meta-duration" class="text-black font-bold">0 mins</b></span>
            </div>

            <!-- Dispatched CTA Action Buttons Hook -->
            <button onclick="alert('🚕 Ride Request Sent!\nYour order has been broadcasted to available drivers nearby.')" class="w-full py-4 bg-black text-white font-bold text-center rounded-xl transition-all hover:bg-gray-900 uppercase tracking-wider text-xs shadow-md">
                Request Ride Now
            </button>
        </div>

        <!-- Target Map Node -->
        <div id="map"></div>
    </div>


    <!-- Leaflet Infrastructure Engine Libraries Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        // Global Variables
        let pickupCoords = null;
        let dropoffCoords = null;
        let selectedPaymentMethod = null;
        let selectedVehicleTier = 'UberX';
        let mapInstance = null;
        let routingControlInstance = null;
        let debounceTimerCall;

        // 1. Strict Geofenced Autocomplete Filter Logic (Locks results exclusively to Bangladesh)
        function handleBangladeshAutocomplete(type) {
            clearTimeout(debounceTimerCall);
            const queryValue = document.getElementById(`${type}-input`).value;
            const suggestionsBoxNode = document.getElementById(`${type}-suggestions`);

            if (queryValue.length < 3) {
                suggestionsBoxNode.classList.add('hidden');
                return;
            }

            debounceTimerCall = setTimeout(async () => {
                try {
                    // Restricting search to Bangladesh using countrycodes=bd parameter
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryValue)}&countrycodes=bd&limit=5&addressdetails=1`;
                    const response = await fetch(url);
                    const resultsArray = await response.json();

                    suggestionsBoxNode.innerHTML = '';
                    if (resultsArray.length === 0) {
                        suggestionsBoxNode.classList.add('hidden');
                        return;
                    }

                    suggestionsBoxNode.classList.remove('hidden');
                    resultsArray.forEach(item => {
                        const optionRow = document.createElement('div');
                        optionRow.className = "px-4 py-3 text-xs hover:bg-gray-50 cursor-pointer text-gray-700 font-medium flex items-center gap-2 transition-all";
                        
                        // Clean up lengthy addresses to match Uber's clean UI format
                        const displayTitle = item.display_name.split(',').slice(0, 3).join(',');
                        
                        optionRow.innerHTML = `<span>📍</span> <div class="truncate"><p class="font-bold text-gray-900">${item.name || displayTitle}</p><p class="text-[10px] text-gray-400 truncate">${item.display_name}</p></div>`;
                        
                        optionRow.onclick = () => {
                            document.getElementById(`${type}-input`).value = item.name || displayTitle;
                            suggestionsBoxNode.classList.add('hidden');
                            
                            if (type === 'pickup') {
                                pickupCoords = L.latLng(parseFloat(item.lat), parseFloat(item.lon));
                            } else {
                                dropoffCoords = L.latLng(parseFloat(item.lat), parseFloat(item.lon));
                            }
                            verifyValidationStateForm();
                        };
                        suggestionsBoxNode.appendChild(optionRow);
                    });
                } catch (error) {
                    console.error("Geocoding fetch failure: ", error);
                }
            }, 350);
        }

        // 2. Select Payment Toggle Mode
        function selectPaymentGateway(gatewayId) {
            selectedPaymentMethod = gatewayId;
            document.querySelectorAll('.payment-card').forEach(card => {
                card.classList.remove('border-black', 'bg-black/5', 'ring-2', 'ring-black/10');
            });
            const activeCard = document.getElementById(`pay-${gatewayId}`);
            activeCard.classList.add('border-black', 'bg-black/5', 'ring-2', 'ring-black/10');
            verifyValidationStateForm();
        }

        // 3. Simple Form State Validator Checker
        function verifyValidationStateForm() {
            const actionBtn = document.getElementById('proceed-btn');
            if (pickupCoords && dropoffCoords && selectedPaymentMethod) {
                actionBtn.disabled = false;
                actionBtn.className = "w-full py-4 bg-black text-white font-bold text-center rounded-xl transition-all cursor-pointer uppercase tracking-wider text-xs hover:bg-gray-900 shadow-lg shadow-black/10";
                actionBtn.innerText = "Proceed To Route Match";
            } else {
                actionBtn.disabled = true;
                actionBtn.className = "w-full py-4 bg-gray-200 text-gray-400 font-bold text-center rounded-xl transition-all cursor-not-allowed uppercase tracking-wider text-xs";
                actionBtn.innerText = "Complete Information Above";
            }
        }

        // 4. Mount Map Frame Viewport and Enforce Strict Bounding Box Bounds Rules
        function initializeUberMapScreen() {
            document.getElementById('booking-screen').classList.add('hidden');
            const mapScreenContainer = document.getElementById('map-screen');
            mapScreenContainer.classList.remove('hidden');
            
            setTimeout(() => {
                mapScreenContainer.classList.add('opacity-100');
                
                if (!mapInstance) {
                    // Setting geographical bounds strictly around Bangladesh borders map coordinates
                    const bangladeshBounds = L.latLngBounds(
                        L.latLng(20.59, 88.01), // South West Coordinate Limit
                        L.latLng(26.63, 92.68)  // North East Coordinate Limit
                    );

                    mapInstance = L.map('map', { 
                        zoomControl: false,
                        maxBounds: bangladeshBounds, // Lock view inside Bangladesh boundaries
                        maxBoundsViscosity: 1.0       // Prevent user bouncing out of limits
                    }).setView([23.8103, 90.4125], 12); // Defaults view centered on Dhaka

                    L.control.zoom({ position: 'bottomright' }).addTo(mapInstance);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap'
                    }).addTo(mapInstance);
                }

                document.getElementById('selected-payment-label').innerText = `Method: ${selectedPaymentMethod}`;
                renderRouteOverlayLine();
            }, 50);
        }

        // 5. Draw the Route and Calculate Fare (Using Bangladeshi Taka Conversion Values)
        function renderRouteOverlayLine() {
            if (routingControlInstance) mapInstance.removeControl(routingControlInstance);

            routingControlInstance = L.Routing.control({
                waypoints: [pickupCoords, dropoffCoords],
                lineOptions: { 
                    styles: [{ color: '#000000', weight: 5, opacity: 0.85 }] 
                },
                addWaypoints: false, 
                draggableWaypoints: false, 
                show: false
            }).addTo(mapInstance);

            routingControlInstance.on('routesfound', function(e) {
                const summary = e.routes[0].summary;
                const distanceInKilometers = summary.totalDistance / 1000;
                const durationInMinutes = Math.round(summary.totalTime / 60);

                // Print string metrics variables to layout view panels
                document.getElementById('meta-distance').innerText = `${distanceInKilometers.toFixed(2)} km`;
                document.getElementById('meta-duration').innerText = `${durationInMinutes} mins`;

                // Uber Bangladesh Cost Struct Base Pricing Logic Matrices
                const priceUberX = 50 + (distanceInKilometers * 18);
                const priceUberXL = 90 + (distanceInKilometers * 28);
                const priceMoto = 30 + (distanceInKilometers * 9);

                document.getElementById('uberx-price').innerText = `৳${priceUberX.toFixed(2)}`;
                document.getElementById('uberxl-price').innerText = `৳${priceUberXL.toFixed(2)}`;
                document.getElementById('moto-price').innerText = `৳${priceMoto.toFixed(2)}`;
                
                // Automatically zoom map frame down to fit both markers perfectly on page frame grid
                const routeGroup = L.featureGroup([
                    L.marker(pickupCoords),
                    L.marker(dropoffCoords)
                ]);
                mapInstance.fitBounds(routeGroup.getBounds().pad(0.3));
            });
        }

        function toggleRideTierStyle(tierId) {
            selectedVehicleTier = tierId;
            document.querySelectorAll('.car-tier').forEach(box => {
                box.classList.remove('border-black');
                box.classList.add('border-gray-200');
            });
            document.getElementById(`tier-${tierId}`).classList.remove('border-gray-200');
            document.getElementById(`tier-${tierId}`).classList.add('border-black');
        }

        function returnBackToFormView() {
            document.getElementById('map-screen').classList.add('hidden', 'opacity-0');
            document.getElementById('booking-screen').classList.remove('hidden');
        }

        // Collapse open results dropdown fields on outside window click events automatically
        document.addEventListener('click', function(e) {
            if (!e.target.closest('#pickup-input')) document.getElementById('pickup-suggestions').classList.add('hidden');
            if (!e.target.closest('#dropoff-input')) document.getElementById('dropoff-suggestions').classList.add('hidden');
        });
    </script>
</body>
</html>
