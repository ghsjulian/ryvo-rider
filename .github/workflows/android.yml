name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Install Capacitor Assets
        working-directory: frontend
        run: npm install -D @capacitor/assets

      - name: Generate Capacitor Assets
        run: npx capacitor-assets generate
        working-directory: frontend

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant Gradle Permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ryvo-Rider-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ryvo-Rider-Release-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Ryvo-Rider-Release-AAB
          path: frontend/android/app/build/outputs/bundle/release/*.aab
