<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel-Aide - Step 5: Vitals & Consent Check</title>
    <style>
        /* Base Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* App Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            position: relative;
        }

        /* Top Header */
        .header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .btn-back {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        /* Content Panel */
        .content {
            padding: 20px;
            flex: 1;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Dispatch Call Button */
        .btn-dispatch {
            width: 100%;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        /* Form Elements for Vitals */
        .vital-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            color: #34495e;
            font-weight: 600;
            font-size: 12px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
        }

        /* Signature Canvas Box */
        .signature-box {
            border: 1.5px dashed #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            position: relative;
            margin-top: 8px;
        }

        canvas {
            width: 100%;
            height: 100px;
            display: block;
            touch-action: none; /* Prevents scrolling on mobile while signing */
        }

        .clear-sig {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 10px;
            background: #e2e8f0;
            border: none;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Submit Button */
        .btn-submit {
            background-color: #3498db;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <button class="btn-back" onclick="window.location.href='ride-booking.html'">←</button>
            <h2>Step 5: Pre-Ride Vitals Check</h2>
            <span></span>
        </div>

        <div class="content">

            <button class="btn-dispatch" onclick="alert('Dispatch Notified: Rider pickup verified.')">
                📞 1. Call Dispatch to Confirm Pickup
            </button>

            <div class="card">
                <div class="card-title">
                    <span>Passenger Consent Signature</span>
                    <span style="font-size:10px; color:#64748b;">HIPAA Compliant</span>
                </div>
                <p style="font-size: 11px; color: #64748b; margin-bottom: 8px;">
                    Rider or legal guardian must sign to authorize pre-ride vital monitoring.
                </p>
                <div class="signature-box">
                    <button class="clear-sig" onclick="clearSignature()">Clear</button>
                    <canvas id="sigCanvas"></canvas>
                </div>
            </div>

            <form id="vitalsForm" onsubmit="submitVitals(event)">
                <div class="card">
                    <div class="card-title">2. Vital Check Input</div>
                    
                    <div class="vital-grid">
                        <div class="form-group">
                            <label for="bp">Blood Pressure</label>
                            <input type="text" id="bp" placeholder="e.g. 120/80" required>
                        </div>
                        <div class="form-group">
                            <label for="pulseOx">Pulse-Ox (% SpO2)</label>
                            <input type="number" id="pulseOx" placeholder="e.g. 98%" min="70" max="100" required>
                        </div>
                        <div class="form-group">
                            <label for="sugar">Sugar Test (mg/dL)</label>
                            <input type="number" id="sugar" placeholder="e.g. 110">
                        </div>
                        <div class="form-group">
                            <label for="temp">Temperature (°F)</label>
                            <input type="text" id="temp" placeholder="e.g. 98.6" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Start Trip (Proceed to Navigation)</button>
            </form>

        </div>
    </div>

    <script>
        // Signature Pad Interactive Setup
        const canvas = document.getElementById('sigCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        // Resize Canvas internal resolution correctly
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        ctx.strokeStyle = '#2c3e50';
        ctx.lineWidth = 2;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); });
        canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); });
        canvas.addEventListener('mouseup', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); });
        canvas.addEventListener('touchmove', (e) => { if (!isDrawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); });
        canvas.addEventListener('touchend', () => isDrawing = false);

        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Vitals submission handler
        function submitVitals(e) {
            e.preventDefault();
            const vitalsData = {
                bp: document.getElementById('bp').value,
                pulseOx: document.getElementById('pulseOx').value,
                sugar: document.getElementById('sugar').value,
                temp: document.getElementById('temp').value
            };

            console.log("Transmitting Vitals & Dispatch Check to Backend:", vitalsData);
            alert("Vitals successfully recorded and dispatched! Starting navigation...");
            window.location.href = 'in-transit.html';
        }
    </script>
</body>
</html>
