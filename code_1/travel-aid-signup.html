<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel-Aide - Sign Up</title>
    <style>
        /* Base Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signup-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #34495e;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        /* Account Type Radio Selector */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            cursor: pointer;
        }

        .radio-label input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        /* Dynamic Conditional Sections */
        .dynamic-section {
            display: none;
            background-color: #f9fbfd;
            border-left: 4px solid #3498db;
            padding: 15px;
            border-radius: 0 6px 6px 0;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
        }

        .checkbox-label input {
            margin-top: 3px;
        }

        /* Submit Button */
        .btn-submit {
            background-color: #3498db;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }

        /* Helpful Info Text */
        .info-text {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Join Travel-Aide</h2>
        <p class="subtitle">Secure and healthcare-conscious ridesharing</p>

        <form id="signupForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="(555) 555-5555">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Minimum 6 characters">
            </div>

            <div class="form-group">
                <label>I want to sign up as a:</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="accountType" value="rider" checked onclick="toggleFields()"> Rider (Passenger)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="accountType" value="driver" onclick="toggleFields()"> Driver (Healthcare Professional)
                    </label>
                </div>
            </div>

            <div id="riderFields" class="dynamic-section" style="display: block;">
                <h3 style="font-size: 16px; color: #2c3e50; margin-bottom: 12px;">Rider Medical Profiles & Needs</h3>
                
                <div class="form-group">
                    <label for="healthRisk">Primary Health Risk / Disability</label>
                    <select id="healthRisk">
                        <option value="">-- Select Option if Applicable --</option>
                        <option value="elderly">Elderly / Senior Conscious Care</option>
                        <option value="mobility">Mobility Impaired (Requires Ramp/Lift)</option>
                        <option value="visual">Visual / Hearing Impairment</option>
                        <option value="cognitive">Mentally Challenged / Cognitive Disability</option>
                        <option value="chronic">At Health Risk (Chronic Illness)</option>
                        <option value="other">Other Condition</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="conditionDetails">Condition Details & Specific Accommodations</label>
                    <textarea id="conditionDetails" rows="3" placeholder="Please describe any medical backgrounds, specific needs, or tools you travel with so your healthcare driver can prepare..."></textarea>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="hipaaConsent" required>
                        I acknowledge and accept the HIPAA compliance and privacy terms. Travel-Aide will secure my Protected Health Information (PHI).
                    </label>
                </div>
            </div>

            <div id="driverFields" class="dynamic-section">
                <h3 style="font-size: 16px; color: #2c3e50; margin-bottom: 12px;">Professional Medical & Vehicle Credentials</h3>
                
                <div class="form-group">
                    <label for="driverLicense">Driver's License Number</label>
                    <input type="text" id="driverLicense" placeholder="DL-12345678">
                </div>

                <div class="form-group">
                    <label for="insuranceInfo">Auto Insurance Provider & Policy #</label>
                    <input type="text" id="insuranceInfo" placeholder="State Farm Policy #0000">
                </div>

                <div class="form-group">
                    <label for="nursingLicense">Healthcare Certification Type</label>
                    <select id="nursingLicense">
                        <option value="STNA">STNA (State Tested Nursing Assistant)</option>
                        <option value="CNA">CNA (Certified Nurse Aide)</option>
                        <option value="LNA">LNA (Licensed Nursing Aide)</option>
                        <option value="NA">NA (Nursing Aide)</option>
                    </select>
                    <div class="info-text">Note: Credentials will be thoroughly cross-checked.</div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="kitConfirmation">
                        I confirm my vehicle passes physical visual standards and I agree to carry the mandatory Travel-Aide Lifesaving Portable Kit (AED, BP Monitor, Oxygen Concentrator, Choking First Aid device).
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-submit">Create Account</button>
        </form>
    </div>

    <script>
        function toggleFields() {
            const accountType = document.querySelector('input[name="accountType"]:checked').value;
            const riderFields = document.getElementById('riderFields');
            const driverFields = document.getElementById('driverFields');
            
            // Input Elements to dynamically apply/remove HTML5 "required" markers
            const hipaaCheck = document.getElementById('hipaaConsent');
            const driverLicense = document.getElementById('driverLicense');
            const insuranceInfo = document.getElementById('insuranceInfo');
            const kitCheck = document.getElementById('kitConfirmation');

            if (accountType === 'rider') {
                riderFields.style.display = 'block';
                driverFields.style.display = 'none';
                
                // Set requirements
                hipaaCheck.required = true;
                driverLicense.required = false;
                insuranceInfo.required = false;
                kitCheck.required = false;
            } else {
                riderFields.style.display = 'none';
                driverFields.style.display = 'block';
                
                // Set requirements
                hipaaCheck.required = false;
                driverLicense.required = true;
                insuranceInfo.required = true;
                kitCheck.required = true;
            }
        }

        // Form Submit Handler
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const accountType = document.querySelector('input[name="accountType"]:checked').value;
            
            // Build temporary payload data layout to prepare for your MERN Backend structure later
            const baseData = {
                name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value,
                role: accountType
            };

            if (accountType === 'rider') {
                baseData.riderDetails = {
                    healthRisk: document.getElementById('healthRisk').value,
                    conditionDetails: document.getElementById('conditionDetails').value,
                    hipaaAccepted: document.getElementById('hipaaConsent').checked
                };
            } else {
                baseData.driverDetails = {
                    driverLicense: document.getElementById('driverLicense').value,
                    insuranceInfo: document.getElementById('insuranceInfo').value,
                    certificationType: document.getElementById('nursingLicense').value,
                    kitEquipped: document.getElementById('kitConfirmation').checked
                };
            }

            console.log("Submitting targeted registration payload to future Express backend:", baseData);
            alert(`Account created successfully as a ${accountType.toUpperCase()}! Check your developer console to view the schema payload structure.`);
        });
    </script>
</body>
</html>
