<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Ubar</title>
    <style>
        /* --- Reset & Core Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- Container & Layout --- */
        .login-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header {
            margin-bottom: 32px;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            text-transform: lowercase;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #545454;
            font-weight: 400;
        }

        /* --- Form Elements --- */
        .form-group {
            position: relative;
            margin-bottom: 24px;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            background-color: #f6f6f6;
            border: 2px solid transparent;
            border-radius: 8px;
            color: #000000;
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        /* Floating Label Effect */
        .form-label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #545454;
            pointer-events: none;
            transition: all 0.2s ease-in-out;
            font-size: 1rem;
        }

        /* Input Focus & Active States */
        .form-input:focus,
        .form-input:not(:placeholder-shown) {
            background-color: #ffffff;
            border-color: #000000;
            padding-top: 22px;
            padding-bottom: 10px;
        }

        .form-input:focus + .form-label,
        .form-input:not(:placeholder-shown) + .form-label {
            top: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #000000;
        }

        /* --- Validation States --- */
        .form-input.invalid {
            border-color: #000000;
            background-color: #fff8f8;
        }

        .error-message {
            font-size: 0.8rem;
            font-weight: 500;
            color: #000000;
            margin-top: 6px;
            display: none;
        }

        .form-input.invalid ~ .error-message {
            display: block;
        }

        /* --- Forgot Password Link --- */
        .forgot-password {
            display: block;
            text-align: right;
            margin-bottom: 24px;
            font-size: 0.9rem;
            color: #545454;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            color: #000000;
            text-decoration: underline;
        }

        /* --- Primary Button --- */
        .btn-submit {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 600;
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* --- Footer Link --- */
        .footer-link {
            text-align: center;
            margin-top: 32px;
            font-size: 0.95rem;
            color: #545454;
        }

        .footer-link a {
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        /* Minimalist Arrow Icon */
        .arrow-icon {
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn-submit:hover .arrow-icon {
            transform: translateX(4px);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <header class="header">
            <h1 class="logo">ubar</h1>
            <p class="subtitle">Welcome back. Sign in to your account</p>
        </header>

        <form id="loginForm" novalidate>
            <!-- Email Address -->
            <div class="form-group">
                <input type="email" id="email" class="form-input" placeholder=" " required>
                <label for="email" class="form-label">Email Address</label>
                <div class="error-message">Please enter a valid email address.</div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <input type="password" id="password" class="form-input" placeholder=" " required minlength="6">
                <label for="password" class="form-label">Password</label>
                <div class="error-message">Password must be at least 6 characters long.</div>
            </div>

            <a href="#" class="forgot-password">Forgot password?</a>

            <button type="submit" class="btn-submit">
                Log In <span class="arrow-icon">→</span>
            </button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="index.html">Sign up</a>
        </div>
    </div>

    <!-- Live Validation Script -->
    <script>
        const form = document.getElementById('loginForm');
        const inputs = form.querySelectorAll('.form-input');

        inputs.forEach(input => {
            input.addEventListener('blur', () => {
                validateInput(input);
            });

            input.addEventListener('input', () => {
                if (input.classList.contains('invalid')) {
                    validateInput(input);
                }
            });
        });

        function validateInput(input) {
            let isValid = input.checkValidity();
            
            if (input.type === 'email' && isValid) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                isValid = emailRegex.test(input.value);
            }

            if (!isValid) {
                input.classList.add('invalid');
            } else {
                input.classList.remove('invalid');
            }
            return isValid;
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            let isFormValid = true;

            inputs.forEach(input => {
                const isValid = validateInput(input);
                if (!isValid) isFormValid = false;
            });

            if (isFormValid) {
                alert('Logging in...');
                // Proceed with system authentication logic here
            }
        });
    </script>
</body>
</html>
